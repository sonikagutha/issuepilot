<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}IssuePilot{% endblock %}</title>
  <script>
    // Apply a saved light/dark choice before first paint to avoid a flash.
    try { const t = localStorage.getItem("issuepilot.theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/cozy.css">
</head>
<body>
  <header class="site-header">
    <div class="site-header__inner">
      <a class="brand" href="/"><span class="brand__mark">🧭</span><span class="brand__text">IssuePilot</span></a>
      <div class="header-right">
        <nav class="nav">
          <a href="/" class="{{ 'active' if active == 'home' }}">Home</a>
          <a href="/analyze" class="{{ 'active' if active == 'analyze' }}">Analyze</a>
          <a href="/dashboard" class="{{ 'active' if active == 'dashboard' }}">Dashboard</a>
        </nav>
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle dark mode">🌙</button>
      </div>
    </div>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer muted">made with care for first-time contributors ☕</footer>
  <script src="/static/theme.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
