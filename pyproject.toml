[project]
name = "issuepilot"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "langchain>=1.3.18",
    "langchain-anthropic>=1.7.0",
    "langchain-openai>=1.6.0",
    "langgraph>=1.2.11",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "tenacity>=9.1.4",
    "typer>=0.27.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
    "respx>=0.23.1",
]

[project.scripts]
issuepilot = "issuepilot.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
